# Hackathon VM: 4 CPU / 8 GiB, local CPU speech and organizer SIP gateway.
# Secrets and generated Asterisk configuration live in ignored secrets/.
services:
  outbound:
    environment:
      ARI_URL: http://host.docker.internal:18088
      OUTBOUND_ALLOWED_PHONES: ${OUTBOUND_ALLOWED_PHONES:-phone-114}
  scenario-editor:
    environment:
      EDITOR_SECURE_COOKIE: "1"
      EDITOR_BOOTSTRAP_PASSWORD: ${EDITOR_LOGIN_PASSWORD:?Set a private administrator password in .env}
  asr:
    environment:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
  tts:
    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["0.0.0.0:8000:8000"]
    networks: [clinic]
    volumes:
      - ./deploy/vm/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      scenario-editor: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 6
  telephony:
    command: ["asterisk", "-f"]
    volumes:
      - /opt/hackathon/sip/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./deploy/vm/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./deploy/vm/http.conf:/etc/asterisk/http.conf:ro
      - ./deploy/vm/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./secrets/ari.conf:/etc/asterisk/ari.conf:ro
  ari-bridge:
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      ARI_URL: http://127.0.0.1:18088
      ORCHESTRATOR_URL: http://127.0.0.1:8080
      AUDIOSOCKET_BIND: 127.0.0.1:9092
      AUDIOSOCKET_ADVERTISE: 127.0.0.1:9092
      OPERATOR_SIP_ENDPOINT: ${OPERATOR_SIP_ENDPOINT:-PJSIP/phone-114@gateway}
